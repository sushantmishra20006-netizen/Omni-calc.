<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Phone Bezel & Outer Frame -->
  <rect x="10" y="10" width="380" height="780" rx="44" fill="#1e293b" stroke="#334155" stroke-width="4" filter="url(#shadow2)" />
  <rect x="18" y="18" width="364" height="764" rx="36" fill="url(#bodyGrad2)" />

  <!-- Status Bar -->
  <circle cx="200" cy="36" r="5" fill="#000" />
  <rect x="160" y="32" width="80" height="8" rx="4" fill="#020617" />
  <text x="45" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">9:41</text>
  <text x="345" y="40" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">100%</text>

  <!-- App Header -->
  <rect x="30" y="56" width="340" height="42" rx="10" fill="#1e293b" opacity="0.6" />
  <text x="42" y="82" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">OmniCalc™</text>
  <text x="130" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Loan & Mortgage</text>
  <rect x="290" y="65" width="70" height="24" rx="6" fill="#3b82f6" opacity="0.2" />
  <text x="302" y="81" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="10" font-weight="700">TILA REG Z</text>

  <!-- Result Highlight Card -->
  <rect x="30" y="110" width="340" height="150" rx="18" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="136" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">MONTHLY PAYMENT (P & I)</text>
  <text x="45" y="180" fill="#34d399" font-family="monospace" font-size="36" font-weight="700">$1,724.31</text>
  <text x="210" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">/ month</text>
  
  <line x1="45" y1="200" x2="355" y2="200" stroke="#334155" stroke-dasharray="4 4" />
  
  <text x="45" y="224" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total Principal: <tspan fill="#f8fafc" font-weight="600">$280,000</tspan></text>
  <text x="220" y="224" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total Interest: <tspan fill="#f8fafc" font-weight="600">$340,751.60</tspan></text>
  <text x="45" y="246" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total Repayment: <tspan fill="#38bdf8" font-weight="700">$620,751.60</tspan></text>

  <!-- Input Form Container -->
  <rect x="30" y="272" width="340" height="236" rx="16" fill="#1e293b" stroke="#334155" />
  
  <!-- Row 1: Home Price & Down Payment -->
  <g transform="translate(42, 286)">
    <text x="0" y="12" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Home Price</text>
    <rect x="0" y="18" width="150" height="38" rx="8" fill="#0f172a" stroke="#475569" />
    <text x="12" y="42" fill="#fff" font-family="monospace" font-size="14" font-weight="600">$350,000</text>

    <text x="164" y="12" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Down Payment (20%)</text>
    <rect x="164" y="18" width="150" height="38" rx="8" fill="#0f172a" stroke="#475569" />
    <text x="176" y="42" fill="#fff" font-family="monospace" font-size="14" font-weight="600">$70,000</text>
  </g>

  <!-- Row 2: Interest Rate & Loan Term -->
  <g transform="translate(42, 360)">
    <text x="0" y="12" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Interest Rate (APR)</text>
    <rect x="0" y="18" width="150" height="38" rx="8" fill="#0f172a" stroke="#475569" />
    <text x="12" y="42" fill="#fff" font-family="monospace" font-size="14" font-weight="600">6.25 %</text>

    <text x="164" y="12" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Loan Term</text>
    <rect x="164" y="18" width="150" height="38" rx="8" fill="#0f172a" stroke="#475569" />
    <text x="176" y="42" fill="#fff" font-family="monospace" font-size="14" font-weight="600">30 Years (360 mo)</text>
  </g>

  <!-- Row 3: Action Buttons -->
  <g transform="translate(42, 444)">
    <rect x="0" y="0" width="314" height="46" rx="10" fill="#10b981" />
    <text x="157" y="28" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">Calculate & Generate Amortization</text>
  </g>

  <!-- Amortization Preview Table -->
  <rect x="30" y="520" width="340" height="210" rx="16" fill="#0f172a" stroke="#334155" />
  <text x="44" y="542" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Amortization Schedule (First Periods)</text>
  
  <g transform="translate(44, 554)">
    <!-- Header -->
    <text x="0" y="12" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">Mo</text>
    <text x="40" y="12" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">Payment</text>
    <text x="110" y="12" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">Principal</text>
    <text x="180" y="12" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">Interest</text>
    <text x="250" y="12" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">Balance</text>
    <line x1="0" y1="20" x2="312" y2="20" stroke="#1e293b" />

    <!-- Row 1 -->
    <text x="0" y="38" fill="#94a3b8" font-family="monospace" font-size="11">01</text>
    <text x="40" y="38" fill="#fff" font-family="monospace" font-size="11">$1,724.31</text>
    <text x="110" y="38" fill="#34d399" font-family="monospace" font-size="11">$266.02</text>
    <text x="180" y="38" fill="#f87171" font-family="monospace" font-size="11">$1,458.33</text>
    <text x="250" y="38" fill="#94a3b8" font-family="monospace" font-size="11">$279,733.98</text>

    <!-- Row 2 -->
    <text x="0" y="60" fill="#94a3b8" font-family="monospace" font-size="11">02</text>
    <text x="40" y="60" fill="#fff" font-family="monospace" font-size="11">$1,724.31</text>
    <text x="110" y="60" fill="#34d399" font-family="monospace" font-size="11">$267.41</text>
    <text x="180" y="60" fill="#f87171" font-family="monospace" font-size="11">$1,456.90</text>
    <text x="250" y="60" fill="#94a3b8" font-family="monospace" font-size="11">$279,466.57</text>

    <!-- Row 3 -->
    <text x="0" y="82" fill="#94a3b8" font-family="monospace" font-size="11">03</text>
    <text x="40" y="82" fill="#fff" font-family="monospace" font-size="11">$1,724.31</text>
    <text x="110" y="82" fill="#34d399" font-family="monospace" font-size="11">$268.80</text>
    <text x="180" y="82" fill="#f87171" font-family="monospace" font-size="11">$1,455.51</text>
    <text x="250" y="82" fill="#94a3b8" font-family="monospace" font-size="11">$279,197.77</text>

    <!-- Row 4 -->
    <text x="0" y="104" fill="#94a3b8" font-family="monospace" font-size="11">04</text>
    <text x="40" y="104" fill="#fff" font-family="monospace" font-size="11">$1,724.31</text>
    <text x="110" y="104" fill="#34d399" font-family="monospace" font-size="11">$270.20</text>
    <text x="180" y="104" fill="#f87171" font-family="monospace" font-size="11">$1,454.11</text>
    <text x="250" y="104" fill="#94a3b8" font-family="monospace" font-size="11">$278,927.57</text>
  </g>

  <!-- Home Indicator & Copyright Label -->
  <rect x="145" y="744" width="110" height="4" rx="2" fill="#475569" />
  <text x="200" y="764" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="9">Copyright © 2026 Sushant Mishra. All Rights Reserved.</text>
</svg>
