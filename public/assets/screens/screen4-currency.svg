<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Phone Bezel & Outer Frame -->
  <rect x="10" y="10" width="380" height="780" rx="44" fill="#1e293b" stroke="#334155" stroke-width="4" filter="url(#shadow4)" />
  <rect x="18" y="18" width="364" height="764" rx="36" fill="url(#bodyGrad4)" />

  <!-- Status Bar -->
  <circle cx="200" cy="36" r="5" fill="#000" />
  <rect x="160" y="32" width="80" height="8" rx="4" fill="#020617" />
  <text x="45" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">9:41</text>
  <text x="345" y="40" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">100%</text>

  <!-- App Header -->
  <rect x="30" y="56" width="340" height="42" rx="10" fill="#1e293b" opacity="0.6" />
  <text x="42" y="82" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">OmniCalc™</text>
  <text x="130" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Forex & Parity Matrix</text>
  <rect x="290" y="65" width="70" height="24" rx="6" fill="#10b981" opacity="0.2" />
  <text x="302" y="81" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">ISO 4217</text>

  <!-- Conversion Conversion Showcase Card -->
  <rect x="30" y="110" width="340" height="170" rx="18" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">SOURCE AMOUNT</text>
  <text x="45" y="166" fill="#fff" font-family="monospace" font-size="26" font-weight="700">1,000.00 USD</text>
  <text x="45" y="186" fill="#94a3b8" font-family="sans-serif" font-size="11">United States Dollar ($)</text>

  <!-- Swap Arrow icon -->
  <circle cx="330" cy="162" r="16" fill="#10b981" />
  <text x="330" y="167" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">⇄</text>

  <line x1="45" y1="200" x2="355" y2="200" stroke="#334155" stroke-dasharray="4 4" />

  <text x="45" y="222" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">CONVERTED DESTINATION AMOUNT</text>
  <text x="45" y="254" fill="#34d399" font-family="monospace" font-size="30" font-weight="700">920.00 EUR</text>
  <text x="240" y="254" fill="#94a3b8" font-family="sans-serif" font-size="11">1 USD = 0.9200 EUR</text>

  <!-- ISO Multi-Currency Parity Matrix Table -->
  <rect x="30" y="295" width="340" height="280" rx="16" fill="#1e293b" stroke="#334155" />
  <text x="44" y="322" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Live Multi-Currency Matrix ($1,000 USD)</text>
  
  <g transform="translate(44, 335)">
    <!-- Table Header -->
    <text x="0" y="14" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">Currency</text>
    <text x="80" y="14" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">Code</text>
    <text x="140" y="14" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">Exchange Rate</text>
    <text x="240" y="14" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">Converted Value</text>
    <line x1="0" y1="22" x2="312" y2="22" stroke="#334155" />

    <!-- EUR -->
    <text x="0" y="44" fill="#fff" font-family="sans-serif" font-size="12">Eurozone</text>
    <text x="80" y="44" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">EUR</text>
    <text x="140" y="44" fill="#94a3b8" font-family="monospace" font-size="12">0.9200</text>
    <text x="240" y="44" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">€920.00</text>

    <!-- GBP -->
    <text x="0" y="74" fill="#fff" font-family="sans-serif" font-size="12">United Kingdom</text>
    <text x="80" y="74" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">GBP</text>
    <text x="140" y="74" fill="#94a3b8" font-family="monospace" font-size="12">0.7850</text>
    <text x="240" y="74" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">£785.00</text>

    <!-- INR -->
    <text x="0" y="104" fill="#fff" font-family="sans-serif" font-size="12">India (Rupee)</text>
    <text x="80" y="104" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">INR</text>
    <text x="140" y="104" fill="#94a3b8" font-family="monospace" font-size="12">83.1500</text>
    <text x="240" y="104" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">₹83,150.00</text>

    <!-- JPY -->
    <text x="0" y="134" fill="#fff" font-family="sans-serif" font-size="12">Japan (Yen)</text>
    <text x="80" y="134" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">JPY</text>
    <text x="140" y="134" fill="#94a3b8" font-family="monospace" font-size="12">154.6000</text>
    <text x="240" y="134" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">¥154,600</text>

    <!-- CAD -->
    <text x="0" y="164" fill="#fff" font-family="sans-serif" font-size="12">Canada (Dollar)</text>
    <text x="80" y="164" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">CAD</text>
    <text x="140" y="164" fill="#94a3b8" font-family="monospace" font-size="12">1.3650</text>
    <text x="240" y="164" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">$1,365.00</text>

    <!-- AUD -->
    <text x="0" y="194" fill="#fff" font-family="sans-serif" font-size="12">Australia (Dollar)</text>
    <text x="80" y="194" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">AUD</text>
    <text x="140" y="194" fill="#94a3b8" font-family="monospace" font-size="12">1.5200</text>
    <text x="240" y="194" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">$1,520.00</text>
  </g>

  <!-- Statutory Parity Footnote -->
  <rect x="30" y="590" width="340" height="135" rx="14" fill="#0f172a" stroke="#334155" />
  <text x="44" y="614" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">Dodd-Frank Foreign Exchange Compliance</text>
  <text x="44" y="636" fill="#94a3b8" font-family="sans-serif" font-size="10">Bank spread margin: 0.00% standard parity</text>
  <text x="44" y="654" fill="#94a3b8" font-family="sans-serif" font-size="10">Transfer fee: $0.00 (Zero markup)</text>
  <text x="44" y="674" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">ISO 4217 Currency Standards Certified</text>
  <text x="44" y="694" fill="#64748b" font-family="sans-serif" font-size="9">Updated dynamically from certified interbank mid-market feeds.</text>

  <!-- Home Indicator & Copyright Label -->
  <rect x="145" y="744" width="110" height="4" rx="2" fill="#475569" />
  <text x="200" y="764" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="9">Copyright © 2026 Sushant Mishra. All Rights Reserved.</text>
</svg>
