<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="displayGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Phone Bezel & Outer Frame -->
  <rect x="10" y="10" width="380" height="780" rx="44" fill="#1e293b" stroke="#334155" stroke-width="4" filter="url(#shadow1)" />
  <rect x="18" y="18" width="364" height="764" rx="36" fill="url(#bodyGrad1)" />

  <!-- Status Bar -->
  <circle cx="200" cy="36" r="5" fill="#000" />
  <rect x="160" y="32" width="80" height="8" rx="4" fill="#020617" />
  <text x="45" y="40" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">9:41</text>
  <text x="345" y="40" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">100%</text>

  <!-- App Header -->
  <rect x="30" y="56" width="340" height="42" rx="10" fill="#1e293b" opacity="0.6" />
  <text x="42" y="82" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">OmniCalc™</text>
  <text x="130" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Scientific Engine</text>
  <rect x="290" y="65" width="70" height="24" rx="6" fill="#10b981" opacity="0.2" />
  <text x="302" y="81" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">DEG • EXACT</text>

  <!-- Calculation Display Area -->
  <rect x="30" y="110" width="340" height="150" rx="18" fill="url(#displayGrad1)" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="138" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">EXPRESSION (IEEE 754 / SHUNTING-YARD)</text>
  <text x="350" y="170" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="18" font-weight="500">25 * (14 + 6) / 2 + √(144)</text>
  
  <line x1="45" y1="190" x2="355" y2="190" stroke="#334155" stroke-dasharray="4 4" />
  
  <text x="45" y="215" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">VERIFIED CORRECT ANSWER</text>
  <text x="350" y="244" text-anchor="end" fill="#34d399" font-family="monospace" font-size="34" font-weight="700">262</text>

  <!-- Precision Audit Tag -->
  <rect x="30" y="272" width="340" height="30" rx="8" fill="#0f172a" stroke="#1e293b" />
  <circle cx="45" cy="287" r="4" fill="#10b981" />
  <text x="56" y="291" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Correctness: 100% Deterministic • Error: 0.00000000%</text>

  <!-- Keypad Scientific Rows -->
  <!-- Row 1: Scientific functions -->
  <g transform="translate(30, 315)">
    <rect x="0" y="0" width="62" height="42" rx="10" fill="#334155" /><text x="31" y="26" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">sin</text>
    <rect x="70" y="0" width="62" height="42" rx="10" fill="#334155" /><text x="101" y="26" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">cos</text>
    <rect x="140" y="0" width="62" height="42" rx="10" fill="#334155" /><text x="171" y="26" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">tan</text>
    <rect x="210" y="0" width="62" height="42" rx="10" fill="#334155" /><text x="241" y="26" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">log</text>
    <rect x="280" y="0" width="60" height="42" rx="10" fill="#334155" /><text x="310" y="26" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">ln</text>
  </g>

  <!-- Row 2: Constants & Ops -->
  <g transform="translate(30, 368)">
    <rect x="0" y="0" width="62" height="42" rx="10" fill="#334155" /><text x="31" y="26" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">π</text>
    <rect x="70" y="0" width="62" height="42" rx="10" fill="#334155" /><text x="101" y="26" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">e</text>
    <rect x="140" y="0" width="62" height="42" rx="10" fill="#334155" /><text x="171" y="26" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">√</text>
    <rect x="210" y="0" width="62" height="42" rx="10" fill="#334155" /><text x="241" y="26" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">x²</text>
    <rect x="280" y="0" width="60" height="42" rx="10" fill="#334155" /><text x="310" y="26" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">^</text>
  </g>

  <!-- Row 3: Clear, Parens, Div -->
  <g transform="translate(30, 421)">
    <rect x="0" y="0" width="80" height="52" rx="12" fill="#ef4444" opacity="0.8" /><text x="40" y="32" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="15" font-weight="700">AC</text>
    <rect x="88" y="0" width="76" height="52" rx="12" fill="#475569" /><text x="126" y="32" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="15" font-weight="600">(</text>
    <rect x="172" y="0" width="76" height="52" rx="12" fill="#475569" /><text x="210" y="32" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="15" font-weight="600">)</text>
    <rect x="256" y="0" width="84" height="52" rx="12" fill="#f59e0b" /><text x="298" y="32" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">÷</text>
  </g>

  <!-- Row 4: 7, 8, 9, Mult -->
  <g transform="translate(30, 483)">
    <rect x="0" y="0" width="80" height="52" rx="12" fill="#1e293b" /><text x="40" y="33" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600">7</text>
    <rect x="88" y="0" width="76" height="52" rx="12" fill="#1e293b" /><text x="126" y="33" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600">8</text>
    <rect x="172" y="0" width="76" height="52" rx="12" fill="#1e293b" /><text x="210" y="33" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600">9</text>
    <rect x="256" y="0" width="84" height="52" rx="12" fill="#f59e0b" /><text x="298" y="33" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">×</text>
  </g>

  <!-- Row 5: 4, 5, 6, Sub -->
  <g transform="translate(30, 545)">
    <rect x="0" y="0" width="80" height="52" rx="12" fill="#1e293b" /><text x="40" y="33" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600">4</text>
    <rect x="88" y="0" width="76" height="52" rx="12" fill="#1e293b" /><text x="126" y="33" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600">5</text>
    <rect x="172" y="0" width="76" height="52" rx="12" fill="#1e293b" /><text x="210" y="33" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600">6</text>
    <rect x="256" y="0" width="84" height="52" rx="12" fill="#f59e0b" /><text x="298" y="33" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">−</text>
  </g>

  <!-- Row 6: 1, 2, 3, Add -->
  <g transform="translate(30, 607)">
    <rect x="0" y="0" width="80" height="52" rx="12" fill="#1e293b" /><text x="40" y="33" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600">1</text>
    <rect x="88" y="0" width="76" height="52" rx="12" fill="#1e293b" /><text x="126" y="33" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600">2</text>
    <rect x="172" y="0" width="76" height="52" rx="12" fill="#1e293b" /><text x="210" y="33" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600">3</text>
    <rect x="256" y="0" width="84" height="52" rx="12" fill="#f59e0b" /><text x="298" y="33" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">+</text>
  </g>

  <!-- Row 7: 0, ., DEL, Equals -->
  <g transform="translate(30, 669)">
    <rect x="0" y="0" width="80" height="52" rx="12" fill="#1e293b" /><text x="40" y="33" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600">0</text>
    <rect x="88" y="0" width="76" height="52" rx="12" fill="#1e293b" /><text x="126" y="33" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="600">.</text>
    <rect x="172" y="0" width="76" height="52" rx="12" fill="#475569" /><text x="210" y="33" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">DEL</text>
    <rect x="256" y="0" width="84" height="52" rx="12" fill="#10b981" /><text x="298" y="33" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="22" font-weight="700">=</text>
  </g>

  <!-- Home Indicator & Copyright Label -->
  <rect x="145" y="744" width="110" height="4" rx="2" fill="#475569" />
  <text x="200" y="764" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="9">Copyright © 2026 Sushant Mishra. All Rights Reserved.</text>
</svg>
