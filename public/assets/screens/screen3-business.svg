<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Phone Bezel & Outer Frame -->
  <rect x="10" y="10" width="380" height="780" rx="44" fill="#1e293b" stroke="#334155" stroke-width="4" filter="url(#shadow3)" />
  <rect x="18" y="18" width="364" height="764" rx="36" fill="url(#bodyGrad3)" />

  <!-- Status Bar -->
  <circle cx="200" cy="36" r="5" fill="#000" />
  <rect x="160" y="32" width="80" height="8" rx="4" fill="#020617" />
  <text x="45" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">9:41</text>
  <text x="345" y="40" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">100%</text>

  <!-- App Header -->
  <rect x="30" y="56" width="340" height="42" rx="10" fill="#1e293b" opacity="0.6" />
  <text x="42" y="82" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">OmniCalc™</text>
  <text x="130" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Commercial & Tax</text>
  <rect x="290" y="65" width="70" height="24" rx="6" fill="#f59e0b" opacity="0.2" />
  <text x="302" y="81" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700">GAAP / EBIT</text>

  <!-- Key Metrics 2x2 Grid -->
  <g transform="translate(30, 110)">
    <!-- Net Profit Card -->
    <rect x="0" y="0" width="162" height="96" rx="14" fill="url(#cardGrad3)" stroke="#334155" />
    <text x="14" y="24" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">NET PROFIT (AFTER TAX)</text>
    <text x="14" y="56" fill="#34d399" font-family="monospace" font-size="22" font-weight="700">$59,500</text>
    <text x="14" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Net Margin: <tspan fill="#38bdf8" font-weight="600">23.8%</tspan></text>

    <!-- Gross Margin Card -->
    <rect x="178" y="0" width="162" height="96" rx="14" fill="url(#cardGrad3)" stroke="#334155" />
    <text x="192" y="24" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">GROSS PROFIT</text>
    <text x="192" y="56" fill="#60a5fa" font-family="monospace" font-size="22" font-weight="700">$125,000</text>
    <text x="192" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Markup: <tspan fill="#fbbf24" font-weight="600">100.0%</tspan></text>

    <!-- Break-Even Units Card -->
    <rect x="0" y="108" width="162" height="96" rx="14" fill="url(#cardGrad3)" stroke="#334155" />
    <text x="14" y="132" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">BREAK-EVEN VOLUME</text>
    <text x="14" y="164" fill="#fbbf24" font-family="monospace" font-size="22" font-weight="700">1,250</text>
    <text x="14" y="186" fill="#94a3b8" font-family="sans-serif" font-size="11">Required units</text>

    <!-- Break-Even Revenue Card -->
    <rect x="178" y="108" width="162" height="96" rx="14" fill="url(#cardGrad3)" stroke="#334155" />
    <text x="192" y="132" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">BREAK-EVEN REVENUE</text>
    <text x="192" y="164" fill="#f43f5e" font-family="monospace" font-size="22" font-weight="700">$62,500</text>
    <text x="192" y="186" fill="#94a3b8" font-family="sans-serif" font-size="11">Minimum gross sales</text>
  </g>

  <!-- Input Form Container -->
  <rect x="30" y="330" width="340" height="236" rx="16" fill="#1e293b" stroke="#334155" />
  
  <g transform="translate(42, 344)">
    <text x="0" y="12" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Annual Gross Revenue</text>
    <rect x="0" y="18" width="150" height="38" rx="8" fill="#0f172a" stroke="#475569" />
    <text x="12" y="42" fill="#fff" font-family="monospace" font-size="14" font-weight="600">$250,000</text>

    <text x="164" y="12" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Cost of Goods (COGS)</text>
    <rect x="164" y="18" width="150" height="38" rx="8" fill="#0f172a" stroke="#475569" />
    <text x="176" y="42" fill="#fff" font-family="monospace" font-size="14" font-weight="600">$125,000</text>
  </g>

  <g transform="translate(42, 418)">
    <text x="0" y="12" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Operating Expenses (OPEX)</text>
    <rect x="0" y="18" width="150" height="38" rx="8" fill="#0f172a" stroke="#475569" />
    <text x="12" y="42" fill="#fff" font-family="monospace" font-size="14" font-weight="600">$55,000</text>

    <text x="164" y="12" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Corporate Tax Rate</text>
    <rect x="164" y="18" width="150" height="38" rx="8" fill="#0f172a" stroke="#475569" />
    <text x="176" y="42" fill="#fff" font-family="monospace" font-size="14" font-weight="600">15.0 %</text>
  </g>

  <g transform="translate(42, 500)">
    <rect x="0" y="0" width="314" height="46" rx="10" fill="#10b981" />
    <text x="157" y="28" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">Calculate Business Margins</text>
  </g>

  <!-- P&L Breakdown Summary -->
  <rect x="30" y="580" width="340" height="150" rx="16" fill="#0f172a" stroke="#334155" />
  <text x="44" y="604" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Income Statement Summary (P&amp;L)</text>

  <g transform="translate(44, 618)">
    <text x="0" y="14" fill="#94a3b8" font-family="sans-serif" font-size="11">Gross Revenue</text>
    <text x="312" y="14" text-anchor="end" fill="#fff" font-family="monospace" font-size="12">$250,000.00</text>
    
    <text x="0" y="34" fill="#94a3b8" font-family="sans-serif" font-size="11">Less: COGS</text>
    <text x="312" y="34" text-anchor="end" fill="#f87171" font-family="monospace" font-size="12">-$125,000.00</text>

    <text x="0" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11">Gross Profit (50.0%)</text>
    <text x="312" y="54" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="12">$125,000.00</text>

    <text x="0" y="74" fill="#94a3b8" font-family="sans-serif" font-size="11">Less: OPEX</text>
    <text x="312" y="74" text-anchor="end" fill="#f87171" font-family="monospace" font-size="12">-$55,000.00</text>

    <line x1="0" y1="84" x2="312" y2="84" stroke="#1e293b" />
    <text x="0" y="100" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">Net Profit (After Tax 15%)</text>
    <text x="312" y="100" text-anchor="end" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">$59,500.00</text>
  </g>

  <!-- Home Indicator & Copyright Label -->
  <rect x="145" y="744" width="110" height="4" rx="2" fill="#475569" />
  <text x="200" y="764" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="9">Copyright © 2026 Sushant Mishra. All Rights Reserved.</text>
</svg>
